[package]
name = "ortak"
version = "0.1.0"
edition = "2021"
description = "Coordination-first version layer for concurrent coding agents and humans sharing one live workspace"
license = "MIT"

[dependencies]
anyhow = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
git2 = "0.20"
notify = "7"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[profile.release]
lto = true
strip = true
